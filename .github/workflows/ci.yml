name: CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows x64 (MSVC Release)"
            compiler: MSVC
            build_type: Release
          - name: "Windows x64 (MSVC Debug)"
            compiler: MSVC
            build_type: Debug

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DUNPD_BUILD_TESTS=ON

      - name: Build Driver & Tests
        shell: cmd
        run: |
          ninja -C build

      - name: Run GoogleTest Suite
        shell: cmd
        run: |
          .\build\bin\unpd_tests.exe --gtest_color=yes

      - name: Run CTest Validation
        shell: cmd
        run: |
          cd build && ctest --output-on-failure -C ${{ matrix.build_type }}

      - name: Upload Artifacts
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: unpd-binaries-${{ matrix.compiler }}
          path: |
            build/bin/unpd.sys
            build/bin/unpd_tests.exe
